name: PAP probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Czy runner wchodzi na STRONE ARTYKULU (nie tylko na liste)?
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          H = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
               "Accept-Language": "pl-PL,pl;q=0.9"}

          def zablokowane(t):
              # Skrypt Incapsuli siedzi na KAZDEJ stronie PAP (jest ich CDN-em), wiec
              # sama jego obecnosc nic nie znaczy. Strona-blokada ma ~212 bajtow i
              # zawiera "Request unsuccessful" + numer incydentu.
              return len(t) < 3000 and ("Request unsuccessful" in t or "_Incapsula_Resource" in t)

          # 1) LISTA - wiemy, ze przechodzi (stad biora sie zajawki w feedzie)
          lista = requests.get("https://biznes.pap.pl/kategoria/depesze-pap",
                               headers=H, timeout=20)
          blok_listy = zablokowane(lista.text)
          print(f"LISTA:   HTTP {lista.status_code}  {len(lista.text)} znakow  "
                f"blokada={blok_listy}")
          if blok_listy:
              print("WYNIK: runnery TEZ sa blokowane - pomysl odpada, zostajemy na leadach")
              raise SystemExit(0)

          # 2) ARTYKUL - to jest pytanie, na ktore nie znamy odpowiedzi
          soup = BeautifulSoup(lista.text, "html.parser")
          link = next((a["href"] for a in soup.select("a[href]")
                       if "/wiadomosci/" in a["href"]), None)
          if not link:
              print("Nie znalazlem linku do artykulu - zmienil sie layout listy.")
              raise SystemExit(1)
          url = link if link.startswith("http") else "https://biznes.pap.pl" + link
          print(f"ARTYKUL: {url}")

          art = requests.get(url, headers=H, timeout=20)
          blok = zablokowane(art.text)
          tekst = " ".join(p.get_text(strip=True)
                           for p in BeautifulSoup(art.text, "html.parser").select("p"))
          print(f"ARTYKUL: HTTP {art.status_code}  {len(art.text)} znakow  blokada={blok}")
          print(f"TRESC:   {len(tekst)} znakow")
          print(f"PROBKA:  {tekst[:300]}")
          print()
          if not blok and len(tekst) > 500:
              print("WYNIK: PRZECHODZI - mozna przeniesc pobieranie tresci do generatora")
          else:
              print("WYNIK: BLOKADA - runnery nie wchodza na artykuly")
          PY
